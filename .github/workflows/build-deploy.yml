name: 构建并发布

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *" # 北京时间每天 04:30:先刷新数据再发布
  workflow_dispatch:

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 定时与手动触发时:刷新星标、发布节奏、下载次数、Issues 并保存当天快照
      - name: 刷新插件数据
        if: github.event_name != 'push'
        run: node scripts/refresh-plugins.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 内容指纹台账:按页面的有意义内容算指纹,内容没变就沿用旧日期(sitemap 的 lastmod 不再每天变)。
      # 每次运行都要做(代码推送也可能改了教程或文案),并在下一步与数据一起提交回仓库。
      - name: 更新内容指纹台账
        run: node --experimental-strip-types scripts/prerender.mjs --ledger-only

      - name: 提交刷新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if ! git diff --cached --quiet; then
            git commit -m "${{ github.event_name == 'push' && '更新内容指纹台账' || '每日刷新插件数据' }}"
            # 刷新期间 main 可能已有新提交:先同步再推送,避免因快进失败而丢掉当天数据
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build

      # 构建产物发布到 deploy 分支;网站服务器定时拉取该分支(服务器上不放任何密钥)
      - name: 发布到 deploy 分支
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "构建 ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
