name: 构建并发布

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *" # 北京时间每天 04:30:先刷新数据再发布
  # 有人提交、修改或重新打开 Issue 时:自动核对「申请收录」并收录合格的(见 scripts/intake.mjs)
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: write
  issues: write # 自动收录:在申请收录的 Issue 里公开回复处理结果、关闭已收录的

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 自动收录:按收录规则统一核对打开着的「申请收录」,合格的写进插件数据(随后的步骤会测试、构建、发布);
      # 回复与关闭 Issue 要等网站发布成功之后(见「公开回复收录结果」)。核对出错只记日志,不影响发布。
      - name: 自动收录插件申请
        if: github.event_name != 'push'
        continue-on-error: true
        run: node --experimental-strip-types scripts/intake.mjs apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 定时与手动触发时:刷新星标、发布节奏、下载次数、Issues、最新版本与安装包,并保存当天快照
      # (Issue 触发时只做收录,不跑整份数据刷新)
      - name: 刷新插件数据
        if: github.event_name != 'push' && github.event_name != 'issues'
        run: node --experimental-strip-types scripts/refresh-plugins.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 内容指纹台账:按页面的有意义内容算指纹,内容没变就沿用旧日期(sitemap 的 lastmod 不再每天变)。
      # 同一步还更新下架台账 src/data/delisted.json(按收录规则自动下架的插件从哪天起下架;恢复上架的删除),
      # 它也在 src/data 下,下一步的 git add src/data 会一并提交,所以不需要另加步骤。
      # 每次运行都要做(代码推送也可能改了教程或文案),并在下一步与数据一起提交回仓库。
      - name: 更新内容指纹台账与下架台账
        run: node --experimental-strip-types scripts/prerender.mjs --ledger-only

      - name: 提交刷新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          if ! git diff --cached --quiet; then
            git commit -m "${{ github.event_name == 'push' && '更新内容指纹台账' || github.event_name == 'issues' && '自动收录插件申请' || '每日刷新插件数据' }}"
            # 刷新期间 main 可能已有新提交:先同步再推送,避免因快进失败而丢掉当天数据
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 测试
        run: npm test

      - name: 构建
        run: npm run build

      # 构建产物发布到 deploy 分支;网站服务器定时拉取该分支(服务器上不放任何密钥)
      - name: 发布到 deploy 分支
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "构建 ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy

      # 网站发布成功后,在申请收录的 Issue 里公开回复处理结果(已收录的关闭;不合格的写明原因,改好后会自动重新检查)
      - name: 公开回复收录结果
        if: github.event_name != 'push'
        continue-on-error: true
        run: node --experimental-strip-types scripts/intake.mjs notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 把今天内容有变化的页面地址通知搜索引擎(IndexNow);失败不影响发布结果
      - name: 通知搜索引擎
        run: node scripts/indexnow.mjs
